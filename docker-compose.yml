services:
  samba-ad:
    image: instantlinux/samba-dc

    container_name: active_directory_samba

    hostname: dc1
    domainname: example.local

    cap_add:
      - SYS_ADMIN

    environment:
      REALM: EXAMPLE.LOCAL
      WORKGROUP: EXAMPLE
      NETBIOS_NAME: DC1

    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "88:88/tcp"
      - "389:389/tcp"
      - "445:445/tcp"
      - "636:636/tcp"

    secrets:
      - samba-admin-password

    volumes:
      - samba_data:/var/lib/samba
      - samba_etc:/etc/samba

    restart: unless-stopped

secrets:
  samba-admin-password:
    file: ./secrets/admin-password.txt

volumes:
  samba_data:
  samba_etc:
